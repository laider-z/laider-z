      </circle>
      <circle cx="980" cy="230" r="150" fill="#FFFFFF">
        <animate attributeName="cy" values="230;110;230" dur="14s" repeatCount="indefinite" calcMode="spline"
          keyTimes="0;0.5;1" keySplines="0.45 0 0.55 1;0.45 0 0.55 1"/>
      </circle>
    </g>

    <rect width="1200" height="340" fill="url(#dots)"/>
    <rect width="1200" height="340" fill="url(#vignette)"/>

    <!-- Тонкий луч, скользящий по нижней кромке. -->
    <rect x="-300" y="338.5" width="300" height="1.5" fill="url(#beam)">
      <animate attributeName="x" values="-300;1200" dur="7s" repeatCount="indefinite"/>
    </rect>

    <!-- Ник: металлическая заливка, плавное появление и бегущий блик. -->
    <g font-family="ui-sans-serif, -apple-system, 'SF Pro Display', 'Segoe UI Variable Display', 'Segoe UI', Inter, system-ui, sans-serif" font-size="132" font-weight="800" letter-spacing="-3">
      <g opacity="0">
        <animate attributeName="opacity" values="0;1" dur="1s" fill="freeze"/>
        <animateTransform attributeName="transform" type="translate" values="0 14;0 0" dur="1s" fill="freeze"
          calcMode="spline" keyTimes="0;1" keySplines="0.2 0.8 0.2 1"/>
        <text x="90" y="182" fill="url(#metal)">laider</text>
        <text x="90" y="182" fill="url(#sheen)">laider</text>
      </g>
    </g>

    <!-- Строка с набором текста. -->
