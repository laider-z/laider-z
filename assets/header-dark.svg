<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-label="laider">
  <defs>
    <clipPath id="frame"><rect width="1200" height="340" rx="24"/></clipPath>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="70"/></filter>
    <radialGradient id="vignette" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0.55" stop-color="#060607" stop-opacity="0"/>
      <stop offset="1" stop-color="#060607" stop-opacity="0.95"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#F5F5F7" fill-opacity="0.11"/>
    </pattern>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0.15" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#8E8E93"/>
    </linearGradient>
    <!-- Блик, пробегающий по нику. -->
    <linearGradient id="sheen" gradientUnits="userSpaceOnUse" x1="-260" y1="0" x2="-20" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#FFFFFF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="0 0; 0 0; 760 0; 760 0"
        keyTimes="0; 0.55; 0.85; 1" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F5F5F7" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#F5F5F7" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#F5F5F7" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="t0"><rect x="96" y="216" width="0" height="40">
