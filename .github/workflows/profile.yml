name: Профиль

# Раз в день обновляет карточку активности и «змейку» по графику вклада.
# Картинки складываются в ветку output этого репозитория — без сторонних сервисов.

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: profile
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - name: Карточка активности
        run: node scripts/stats.mjs dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Змейка по графику вклада
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-dark.svg?palette=github-dark&color_snake=#F5F5F7&color_dots=#161618,#3A3A3C,#636366,#AEAEB2,#F5F5F7&color_background=#0A0A0B
            dist/snake-light.svg?color_snake=#0A0A0B&color_dots=#E5E5EA,#C7C7CC,#8E8E93,#48484A,#0A0A0B&color_background=#F5F5F7

      - name: Змейка без полосы прогресса
        run: node scripts/snake-trim.mjs dist/snake-dark.svg dist/snake-light.svg

      - name: Публикация в ветку output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          keep_history: false
          commit_message: Обновление картинок профиля
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
